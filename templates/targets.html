{% extends "base.html" %}
{% block content %}
<style>
  .card { background: #1f2937; border-radius: 12px; padding: 30px; max-width: 500px; margin: 0 auto; border: 1px solid #374151; }
  h2 { margin-bottom: 25px; }
  .form-group { margin-bottom: 20px; }
  label { display: block; margin-bottom: 8px; color: #9ca3af; font-size: 14px; }
  input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #374151; background: #111827; color: white; font-size: 15px; }
  button { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { background: #2563eb; }
  .info-box { background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.3); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
</style>

<div class="card">
  <h2>🎯 Your Targets</h2>
  <div class="info-box">
    <p><strong>Daily Target:</strong> £{{ "%.2f"|format(tgt.daily_target) }}</p>
    <p><strong>Monthly Target:</strong> £{{ "%.2f"|format(tgt.monthly_target) }}</p>
  </div>

  {% if current_user.is_admin %}
  <form method="POST">
    <div class="form-group">
      <label>Daily Target (£)</label>
      <input type="number" step="0.01" name="daily_target" value="{{ tgt.daily_target }}" required>
    </div>
    <div class="form-group">
      <label>Monthly Target (£)</label>
      <input type="number" step="0.01" name="monthly_target" value="{{ tgt.monthly_target }}" required>
    </div>
    <button type="submit">💾 Update Targets</button>
  </form>
  {% else %}
  <p style="color:#9ca3af">Only the admin can change targets.</p>
  {% endif %}
</div>
{% endblock %}
