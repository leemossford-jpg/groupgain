<!DOCTYPE html>
<html>
<head>
  <title>Share — GroupGain</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#121212;color:#e0e0e0;padding:20px;max-width:600px;margin:0 auto}
    .back{display:inline-block;margin-bottom:20px;color:#60a5fa;text-decoration:none}
    h1{color:#fff;margin-bottom:25px}
    .card{background:#1e1e1e;border-radius:16px;padding:30px;border:1px solid #333;text-align:center;margin-bottom:20px}
    .qr-box{background:#fff;padding:20px;border-radius:12px;display:inline-block;margin:20px 0}
    .qr-img{width:250px;height:250px;display:block}
    .url-box{background:#2a2a2a;padding:12px;border-radius:8px;font-size:14px;color:#93c5fd;word-break:break-all;margin:15px 0;border:1px solid #3a3a3a}
    .flash{background:#1a2f26;color:#6ee7b7;padding:12px;border-radius:8px;margin-bottom:20px;border:1px solid #10b98140}
  </style>
</head>
<body>
  <a href="{{url_for('dashboard')}}" class="back">← Back to Dashboard</a>
  <h1>📤 Share GroupGain</h1>
  
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}{% for cat, msg in messages %}<p class="flash">{{ msg }}</p>{% endfor %}{% endif %}
  {% endwith %}
  
  <div class="card">
    <h3>Signup Link</h3>
    <div class="url-box">{{ profile_url }}</div>
    
    <h3>QR Code</h3>
    <div class="qr-box">
      <img src="data:image/png;base64,{{ qr_code_data }}" alt="QR Code" class="qr-img">
    </div>
    
    <p style="color:#888;font-size:14px">Scan from your phone — uses your local network IP ✅</p>
  </div>
</body>
</html>
