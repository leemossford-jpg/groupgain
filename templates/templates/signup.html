<!DOCTYPE html>
<html>
<head>
  <title>GroupGain - Sign Up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#f0fdf4;padding:20px}
    .card{max-width:420px;margin:40px auto;background:white;padding:30px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
    h1{text-align:center;color:#16a34a;margin-bottom:20px;font-size:24px}
    input{width:100%;padding:14px;margin:8px 0;border:1px solid #e5e7eb;border-radius:10px;font-size:16px}
    button{width:100%;padding:14px;background:#16a34a;color:white;border:none;border-radius:10px;font-size:17px;font-weight:600;cursor:pointer;margin-top:10px}
    .error{background:#fef2f2;color:#dc2626;padding:10px;border-radius:8px;margin:10px 0}
    .success{background:#f0fdf4;color:#16a34a;padding:10px;border-radius:8px;margin:10px 0}
    .link{text-align:center;margin-top:20px;font-size:14px;color:#6b7280}
    a{color:#16a34a;text-decoration:none;font-weight:500}
  </style>
</head>
<body>
  <div class="card">
    <h1>Create Account</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}{% for cat,msg in messages %}<p class="{{cat}}">{{msg}}</p>{% endfor %}{% endif %}
    {% endwith %}
    <form method="POST">
      <input name="username" placeholder="Choose a username" required>
      <input type="password" name="password" placeholder="Create a password (min 6 chars)" required>
      <button>Sign Up</button>
    </form>
    <p class="link">Have an account? <a href="{{url_for('login')}}">Log in</a></p>
  </div>
</body>
</html>
