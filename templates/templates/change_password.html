<!DOCTYPE html>
<html>
<head>
  <title>Change Password — GroupGain</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#121212;color:#e0e0e0;padding:20px;max-width:450px;margin:0 auto}
    h1{color:#fff;margin-bottom:20px}
    form{background:#1e1e1e;padding:25px;border-radius:14px;border:1px solid #333}
    label{font-size:14px;color:#aaa;display:block;margin-bottom:6px}
    input{width:100%;padding:12px;background:#252525;border:1px solid #3a3a3a;border-radius:8px;color:#fff;font-size:15px;margin-bottom:15px}
    input:focus{outline:none;border-color:#10b981}
    button{width:100%;padding:14px;background:linear-gradient(90deg,#10b981,#059669);color:white;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
    button:hover{opacity:0.9}
    .back{display:inline-block;margin-bottom:20px;color:#10b981;text-decoration:none}
    .flash{background:#3a1515;color:#f87171;padding:12px;border-radius:8px;margin-bottom:20px;border:1px solid #ef444440}
  </style>
</head>
<body>
  <a href="{{url_for('dashboard')}}" class="back">← Back to Dashboard</a>
  <h1>🔑 Change Password</h1>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for cat, msg in messages %}
        <p class="flash">{{ msg }}</p>
      {% endfor %}
    {% endif %}
  {% endwith %}
  <form method="post">
    <label>Current Password</label>
    <input type="password" name="old_password" required>
    <label>New Password</label>
    <input type="password" name="new_password" required>
    <label>Confirm New Password</label>
    <input type="password" name="confirm_password" required>
    <button type="submit">Update Password</button>
  </form>
</body>
</html>
