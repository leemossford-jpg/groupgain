<!DOCTYPE html>
<html>
<head>
  <title>Edit My Profile — GroupGain</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#121212;color:#e0e0e0;padding:20px;max-width:550px;margin:0 auto}
    .back{display:inline-block;margin-bottom:20px;color:#60a5fa;text-decoration:none}
    h1{color:#fff;margin-bottom:25px}
    .card{background:#1e1e1e;padding:25px;border-radius:14px;border:1px solid #333;margin-bottom:20px}
    .avatar-preview{width:100px;height:100px;border-radius:50%;object-fit:cover;margin-bottom:15px;background:#2a2a2a}
    label{font-size:14px;color:#aaa;display:block;margin-bottom:6px}
    textarea,input{width:100%;padding:12px;background:#252525;border:1px solid #3a3a3a;border-radius:8px;color:#fff;font-size:15px;margin-bottom:15px}
    button{padding:14px;background:linear-gradient(90deg,#10b981,#059669);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;width:100%;margin-top:5px}
    button:hover{opacity:0.9}
    .flash{background:#1a2f26;color:#6ee7b7;padding:12px;border-radius:8px;margin-bottom:20px;border:1px solid #10b98140}
  </style>
</head>
<body>
  <a href="{{url_for('view_profile', username=user.username)}}" class="back">← View My Profile</a>
  <h1>✏️ Edit My Profile</h1>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}{% for cat, msg in messages %}<p class="flash">{{ msg }}</p>{% endfor %}{% endif %}
  {% endwith %}

  <div class="card">
    <h3 style="margin-bottom:15px">📷 Profile Picture</h3>
    <img src="{{ url_for('static', filename='profile_pics/' + user.profile_pic) }}" class="avatar-preview">
    <form action="{{url_for('upload_avatar')}}" method="post" enctype="multipart/form-data">
      <input type="file" name="avatar" accept="image/png,image/jpeg,image/gif" required>
      <button type="submit">Upload New Picture</button>
    </form>
  </div>

  <div class="card">
    <h3 style="margin-bottom:15px">📝 Bio</h3>
    <form method="post">
      <label>Tell people about yourself</label>
      <textarea name="bio" rows="4">{{ user.bio }}</textarea>
      <button type="submit">💾 Save Profile</button>
    </form>
  </div>
</body>
</html>
