<!DOCTYPE html>
<html>
<head>
  <title>GroupGain — Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{--bg:#f0f4f8;--card:white;--text:#1e293b;--accent:#2563eb;--border:#e2e8f0;}
    body.dark{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--border:#334155;}
    body{font-family:system-ui;background:var(--bg);color:var(--text);padding:2rem;}
    .c{max-width:420px;margin:3rem auto;background:var(--card);padding:2.5rem;border-radius:16px;}
    h2{text-align:center;margin-bottom:2rem;}
    .flash{padding:.75rem;border-radius:8px;margin-bottom:1rem;text-align:center;}
    .flash.err{background:#fee2e2;color:#b91c1c;}
    .flash.ok{background:#dcfce7;color:#166534;}
    input{width:100%;padding:.85rem;margin:.5rem 0;border:1px solid var(--border);border-radius:8px;font-size:1rem;background:transparent;color:var(--text);}
    button{width:100%;padding:.85rem;background:var(--accent);color:white;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;}
    p{text-align:center;margin-top:1.5rem;}
    a{color:var(--accent);text-decoration:none;}
  </style>
</head>
<body>
  <div class="c">
    <h2>🔐 GroupGain</h2>
    {% with m=get_flashed_messages() %}{%if m%}<div class="flash err">{{m[0]}}</div>{%endif%}{%endwith%}
    <form method="post">
      <input name="username" placeholder="Username" required>
      <input name="password" type="password" placeholder="Password" required>
      <button>Log In</button>
    </form>
    <p>New? <a href="{{url_for('register')}}">Create Account</a></p>
  </div>
</body>
</html>
