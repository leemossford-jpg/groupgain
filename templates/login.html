<!DOCTYPE html>
<html>
<head>
<title>Login — GroupGain</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0f0f0f;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#1a1a1a;padding:30px;border-radius:12px;width:100%;max-width:400px}
h1{text-align:center;margin-bottom:25px}
.flash{padding:12px;border-radius:8px;margin-bottom:15px}
.error{background:#3d1f1f;color:#ffb3b3}
.success{background:#1f3d2f;color:#b3ffc7}
.info{background:#1f2f3d;color:#b3d4ff}
form{display:flex;flex-direction:column;gap:14px}
input{padding:12px;border:none;border-radius:8px;background:#2a2a2a;color:#fff;font-size:15px}
button{padding:12px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer}
.link{text-align:center;margin-top:18px;color:#999}
a{color:#4d90fe;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<h1>🔐 GroupGain</h1>
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}{%for c,msg in messages%}<div class="flash {{c}}">{{msg}}</div>{%endfor%}{%endif%}{%endwith%}
<form method="post">
<input name="username" placeholder="Username" required>
<input type="password" name="password" placeholder="Password" required>
<button>Log In</button>
</form>
<div class="link">
No account? <a href="{{url_for('signup')}}">Sign Up</a>
<br><br>
Forgot password? Contact an admin
</div>
</div>
</body>
</html>
