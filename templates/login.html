<!DOCTYPE html>
<html>
<head>
  <title>Login — GroupGain</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#121212;color:#e0e0e0;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
    .card{background:#1e1e1e;border-radius:16px;padding:30px;border:1px solid #333;width:100%;max-width:420px}
    h1{text-align:center;margin-bottom:25px;color:#fff;font-size:22px}
    .flash{padding:12px;border-radius:8px;margin-bottom:20px;text-align:center}
    .flash.success{background:#1a2f26;color:#6ee7b7;border:1px solid #10b98140}
    .flash.error{background:#3c1515;color:#f87171;border:1px solid #ef444440}
    label{font-size:14px;color:#aaa;display:block;margin-bottom:6px}
    input{width:100%;padding:12px;background:#252525;border:1px solid #3a3a3a;border-radius:8px;color:#fff;font-size:15px;margin-bottom:15px}
    button{width:100%;padding:14px;background:linear-gradient(90deg,#2563eb,#1d4ed8);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
    button:hover{opacity:0.9}
    .signup-link{text-align:center;margin-top:20px;color:#888;font-size:14px}
    .signup-link a{color:#60a5fa;text-decoration:none}
    .forgot-link{text-align:center;margin-top:15px;padding-top:15px;border-top:1px solid #333}
    .forgot-link a{color:#fbbf24;text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
    <h1>🔐 Log In</h1>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}{% for cat, msg in messages %}<p class="flash {{cat}}">{{ msg }}</p>{% endfor %}{% endif %}
    {% endwith %}

    <form method="post">
      <label>Username</label>
      <input type="text" name="username" required>
      
      <label>Password</label>
      <input type="password" name="password" required>
      
      <button type="submit">Log In</button>
    </form>

    <div class="forgot-link">
      <a href="{{ url_for('forgot_password') }}">🔑 Forgot Password?</a>
    </div>

    <div class="signup-link">
      Don't have an account? <a href="{{ url_for('signup') }}">Sign up →</a>
    </div>
  </div>
</body>
</html>
