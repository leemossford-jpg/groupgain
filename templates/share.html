<!DOCTYPE html>
<html>
<head>
<title>Share — GroupGain</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0f0f0f;color:#e5e5e5;padding:20px;max-width:600px;margin:0 auto}
nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:25px;padding-bottom:15px;border-bottom:1px solid #2a2a2a}
nav a{padding:10px 16px;border-radius:8px;text-decoration:none;color:#ccc;background:#1f1f1f}
.card{background:#1a1a1a;padding:30px;border-radius:12px;text-align:center}
h2{margin-bottom:20px}
.url-box{background:#252525;padding:12px;border-radius:8px;font-family:monospace;word-break:break-all;margin:20px 0;color:#60a5fa}
.qr{margin:25px auto;background:#fff;padding:15px;border-radius:12px;display:inline-block}
.qr img{max-width:250px}
p{color:#999;margin-top:15px}
</style>
</head>
<body>
<nav>
<a href="{{url_for('dashboard')}}">📈 Dashboard</a>
<a href="{{url_for('calendar_view')}}">📅 Calendar</a>
<a href="{{url_for('targets')}}">🎯 Targets</a>
<a href="{{url_for('feed')}}">📰 Feed</a>
<a href="{{url_for('share')}}">📱 Share</a>
{% if current_user.is_admin %}<a href="{{url_for('admin_panel')}}">⚙️ Admin</a>{% endif %}
<a href="{{url_for('logout')}}" style="margin-left:auto">🚪 Logout</a>
</nav>

<div class="card">
<h2>📱 Invite Friends</h2>
<p>Share this link — they sign up, you approve them</p>
<div class="url-box">{{signup_url}}</div>
{% if qr_data %}
<div class="qr"><img src="data:image/png;base64,{{qr_data}}" alt="QR Code"></div>
{% endif %}
<p>Scan with phone camera → create account → approve in Admin</p>
</div>
</body>
</html>
