{% extends "base.html" %}
{% block content %}
<style>
  .card { background: #1f2937; border-radius: 12px; padding: 30px; max-width: 500px; margin: 0 auto; border: 1px solid #374151; text-align: center; }
  h2 { margin-bottom: 20px; }
  .qr-box { background: white; padding: 20px; border-radius: 12px; display: inline-block; margin: 20px 0; }
  .qr-box img { width: 250px; height: 250px; }
  .link-box { background: #111827; padding: 12px; border-radius: 8px; word-break: break-all; font-family: monospace; color: #93c5fd; margin: 15px 0; }
</style>

<div class="card">
  <h2>🔗 Share GroupGain</h2>
  <p style="color:#9ca3af; margin-bottom:10px;">Send this link to friends to join:</p>
  <div class="link-box">{{ signup_url }}</div>
  <div class="qr-box">
    <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code">
  </div>
  <p style="color:#9ca3af; font-size:13px;">Scan to open sign-up page</p>
</div>
{% endblock %}
