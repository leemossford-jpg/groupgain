<!DOCTYPE html>
<html>
<head>
  <title>GroupGain — Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{--bg:#f0f4f8;--card:white;--text:#1e293b;--accent:#22c55e;--border:#e2e8f0;}
    body{font-family:system-ui;background:var(--bg);color:var(--text);padding:2rem;}
    .c{max-width:420px;margin:3rem auto;background:var(--card);padding:2.5rem;border-radius:16px;}
    h2{text-align:center;margin-bottom:2rem;}
    input{width:100%;padding:.85rem;margin:.5rem 0;border:1px solid var(--border);border-radius:8px;font-size:1rem;background:transparent;color:var(--text);}
    button{width:100%;padding:.85rem;background:var(--accent);color:white;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;}
    p{text-align:center;margin-top:1.5rem;}
    a{color:var(--accent);text-decoration:none;}
  </style>
</head>
<body>
  <div class="c">
    <h2>🚀 Join GroupGain</h2>
    {% with m=get_flashed_messages() %}{%if m%}<p style="color:red">{{m[0]}}</p>{%endif%}{%endwith%}
    <form method="post">
      <input name="username" placeholder="Pick a username" required>
      <input name="password" type="password" placeholder="Create password" required>
      <button>Register</button>
    </form>
    <p>Got account? <a href="{{url_for('login')}}">Log In</a></p>
  </div>
</body>
</html>
