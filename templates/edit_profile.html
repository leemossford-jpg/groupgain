{% extends "base.html" %}
{% block content %}
<style>
  .card { background: #1f2937; border-radius: 12px; padding: 30px; max-width: 500px; margin: 0 auto; border: 1px solid #374151; }
  h2 { margin-bottom: 25px; }
  .form-group { margin-bottom: 20px; }
  label { display: block; margin-bottom: 8px; color: #9ca3af; font-size: 14px; }
  input, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #374151; background: #111827; color: white; font-size: 15px; }
  button { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { background: #2563eb; }
  .pic-preview { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; }
</style>

<div class="card">
  <h2>✏️ Edit Your Profile</h2>
  <div style="text-align:center; margin-bottom:20px;">
    {% if user.profile_pic and user.profile_pic != 'default.png' %}
      <img src="{{ url_for('static', filename='profile_pics/' + user.profile_pic) }}" class="pic-preview" alt="Profile">
    {% else %}
      <div style="width:100px; height:100px; border-radius:50%; background:#374151; display:flex; align-items:center; justify-content:center; font-size:40px; margin:0 auto;">👤</div>
    {% endif %}
  </div>

  <form method="POST" enctype="multipart/form-data">
    <div class="form-group">
      <label>Profile Picture</label>
      <input type="file" name="profile_pic" accept="image/*">
    </div>
    <div class="form-group">
      <label>Bio</label>
      <textarea name="bio" rows="4" placeholder="Tell us about yourself...">{{ user.bio }}</textarea>
    </div>
    <button type="submit">💾 Save Changes</button>
  </form>
</div>
{% endblock %}
