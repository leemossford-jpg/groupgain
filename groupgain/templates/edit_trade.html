<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit Trade — GroupGain</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#0b1120;min-height:100vh;color:#e6efff;padding:2rem}
.container{max-width:600px;margin:0 auto}
a.back{color:#7b8ab8;text-decoration:none;display:inline-block;margin-bottom:1.5rem}
form{background:#131c33;padding:2rem;border-radius:16px;border:1px solid #1e2d54;display:flex;flex-direction:column;gap:1rem}
input,select,textarea{padding:.9rem 1rem;border-radius:10px;border:1px solid #1e2d54;background:#1a2542;color:#fff;font-size:1rem;margin-top:.3rem;width:100%}
.btns{display:flex;gap:1rem;margin-top:.5rem}
button{padding:.9rem 1.5rem;border-radius:10px;border:none;font-weight:600;cursor:pointer}
.save{background:#3b82f6;color:#fff}
.del{background:#ef4444;color:#fff}
.cancel{background:transparent;color:#7b8ab8;border:1px solid #1e2d54;text-decoration:none;text-align:center;line-height:2}
</style></head>
<body>
<div class="container">
<a href="{{url_for('dashboard')}}" class="back">← Back</a>
<h1>✏️ Edit {{trade.symbol}}</h1>
<form method="post">
<label>Symbol<input type="text" name="symbol" value="{{trade.symbol}}" required></label>
<label>Asset Type<select name="asset_type">
{%for t in ['Stock','Crypto','Forex','Commodity','Index']%}<option {%if trade.asset_type==t%}selected{%endif%}>{{t}}</option>{%endfor%}
</select></label>
<label>Entry<input type="number" step=".0001" name="entry_price" value="{{trade.entry_price}}" required></label>
<label>Exit<input type="number" step=".0001" name="exit_price" value="{{trade.exit_price or ''}}"></label>
<label>Qty<input type="number" step=".01" name="quantity" value="{{trade.quantity}}" required></label>
<label>Tags<input type="text" name="tags" value="{{trade.tags}}"></label>
<label>Notes<textarea name="notes" rows="3">{{trade.notes}}</textarea></label>
<div class="btns">
<button type="submit" class="save">Save</button>
<a href="{{url_for('dashboard')}}" class="cancel">Cancel</a>
</div>
</form>
<form method="post" action="{{url_for('delete_trade',tid=trade.id)}}" onsubmit="return confirm('Delete? Cannot undo.')" style="margin-top:1rem">
<button type="submit" class="del">🗑️ Delete</button>
</form>
</div>
</body></html>
