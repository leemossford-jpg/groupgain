<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add Trade — GroupGain</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#0b1120;min-height:100vh;color:#e6efff;padding:2rem}
.container{max-width:600px;margin:0 auto}
a.back{color:#7b8ab8;text-decoration:none;display:inline-block;margin-bottom:1.5rem}
a.back:hover{color:#60a5fa}
form{background:#131c33;padding:2rem;border-radius:16px;border:1px solid #1e2d54;display:flex;flex-direction:column;gap:1rem}
label{color:#7b8ab8;font-size:.9rem}
input,select,textarea{padding:.9rem 1rem;border-radius:10px;border:1px solid #1e2d54;background:#1a2542;color:#fff;font-size:1rem;margin-top:.3rem;width:100%}
button{padding:.9rem;border-radius:10px;border:none;background:#3b82f6;color:#fff;font-weight:600;font-size:1rem;cursor:pointer;margin-top:.5rem}
</style></head>
<body>
<div class="container">
<a href="{{url_for('dashboard')}}" class="back">← Back</a>
<h1>➕ Add Trade</h1>
<form method="post">
<label>Symbol<input type="text" name="symbol" placeholder="BTC, AAPL, NG" required></label>
<label>Asset Type<select name="asset_type"><option>Stock</option><option>Crypto</option><option>Forex</option><option>Commodity</option><option>Index</option></select></label>
<label>Entry Price<input type="number" step=".0001" name="entry_price" required></label>
<label>Exit Price<input type="number" step=".0001" name="exit_price" placeholder="Leave blank if open"></label>
<label>Quantity<input type="number" step=".01" name="quantity" required></label>
<label>Tags<input type="text" name="tags" placeholder="long, swing, breakout"></label>
<label>Notes<textarea name="notes" rows="3"></textarea></label>
<button>Save Trade</button>
</form>
</div>
</body></html>
