<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Group — GroupGain</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#0b1120;min-height:100vh;color:#e6efff;padding:2rem}
.container{max-width:520px;margin:0 auto}
a.back{color:#7b8ab8;text-decoration:none;display:inline-block;margin-bottom:1.5rem}
.flash{padding:1rem;background:rgba(59,130,246,.1);border-left:3px solid #3b82f6;border-radius:4px;margin-bottom:1.5rem}
form{background:#131c33;padding:2rem;border-radius:16px;border:1px solid #1e2d54;display:flex;flex-direction:column;gap:1rem;margin-bottom:2rem}
input{padding:.9rem 1rem;border-radius:10px;border:1px solid #1e2d54;background:#1a2542;color:#fff;font-size:1rem}
button{padding:.9rem;border-radius:10px;border:none;background:#3b82f6;color:#fff;font-weight:600;font-size:1rem;cursor:pointer;margin-top:.5rem}
.join{background:#131c33;padding:1.5rem;border-radius:16px;border:1px solid #1e2d54}
</style></head>
<body>
<div class="container">
<a href="{{url_for('dashboard')}}" class="back">← Back</a>
<h1>🏗️ Create Group</h1>
{%with m=get_flashed_messages()%}{%if m%}<div class="flash">{{m[0]}}</div>{%endif%}{%endwith%}
<form method="post">
<label>Group Name<input type="text" name="name" required></label>
<label>Goal Amount (£)<input type="number" step=".01" name="goal_amount" placeholder="0 = no goal"></label>
<label>Join Code<input type="text" name="join_code" placeholder="Shared code for members to join"></label>
<button>Create Group</button>
</form>
<div class="join">
<h3>Or Join Existing</h3>
<form action="{{url_for('join_group')}}" method="post" style="margin-top:1rem">
<input type="text" name="join_code" placeholder="Enter group code" required>
<button type="submit">Join Group</button>
</form>
</div>
</div>
</body></html>
