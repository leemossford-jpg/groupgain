<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — GroupGain</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#0b1120;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#e6efff}
.card{background:#131c33;padding:2.5rem;border-radius:16px;border:1px solid #1e2d54;width:100%;max-width:420px}
h1{text-align:center;margin-bottom:2rem;color:#60a5fa}
.flash{padding:1rem;background:rgba(59,130,246,.1);border-left:3px solid #3b82f6;border-radius:4px;margin-bottom:1.5rem}
form{display:flex;flex-direction:column;gap:1rem}
input{padding:.9rem 1rem;border-radius:10px;border:1px solid #1e2d54;background:#1a2542;color:#fff;font-size:1rem}
button{padding:.9rem;border-radius:10px;border:none;background:#3b82f6;color:#fff;font-weight:600;font-size:1rem;cursor:pointer;margin-top:.5rem}
button:hover{background:#2563eb}
.link{text-align:center;margin-top:1.5rem;color:#7b8ab8;font-size:.9rem}
.link a{color:#60a5fa;text-decoration:none}
</style></head>
<body>
<div class="card">
<h1>🔐 GroupGain</h1>
{%with m=get_flashed_messages()%}{%if m%}<div class="flash">{{m[0]}}</div>{%endif%}{%endwith%}
<form method="post"><input type="text" name="username" placeholder="Username" required><input type="password" name="password" placeholder="Password" required><button>Log In</button></form>
<div class="link">New? <a href="{{url_for('register')}}">Create Account</a></div>
</div>
</body></html>
